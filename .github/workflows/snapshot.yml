name: Daily snapshot

on:
  schedule:
    - cron: "30 21 * * 1-5"  # 21:30 UTC Mon-Fri = after the US close (summer and winter time)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
